# Which peers may assert the client's scheme via X-Forwarded-Proto. A
# TLS-terminating load balancer in front of this proxy terminates https and
# forwards plain http to the :80 listener, so nginx's own $scheme is always
# "http" and cannot describe the client. Only the geo set below may set it:
# all of RFC1918 plus loopback, which includes the compose network
# 172.30.0.0/24 but is wider inside a cloud VPC. No "default 1": every
# unmatched peer is untrusted by design. A load balancer with a public
# address (ALB, CloudFront, Cloudflare) falls outside every shipped range,
# so add its CIDR as a new entry rather than narrowing these.
geo $trusted_proxy {
    default         0;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    127.0.0.0/8     1;
}

# Scheme forwarded to the API. A trusted peer's X-Forwarded-Proto wins — the
# leftmost entry of a proxy chain, http or https only, case-insensitive.
# Everything else (empty header, a non-http(s) value, or a peer that is not a
# trusted proxy) falls back to nginx's own $scheme, so a client cannot spoof
# "https" past a proxy that only ever sees plain http. The token before the
# colon is $trusted_proxy, so only a trusted peer can produce the "1:..." keys
# below; an untrusted peer's header ("0:...") never matches and falls back.
map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default          $scheme;
    "~*^1:https($|,)"  https;
    "~*^1:http($|,)"   http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (same origin → no CORS issues in production)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # WebSocket proxy for realtime notifications
    location /api/v1/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }
}
