name: ${COMPOSE_PROJECT_NAME:-saas-template}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas_template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas_template}
      POSTGRES_DB: ${POSTGRES_DB:-saas_template}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_template} -d ${POSTGRES_DB:-saas_template}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--server_name", "${APP_SLUG:-saas-template}"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres:
    name: ${POSTGRES_VOLUME:-saas_template_pg}
