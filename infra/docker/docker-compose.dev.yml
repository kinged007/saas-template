services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas_template
      POSTGRES_PASSWORD: saas_template
      POSTGRES_DB: saas_template
    ports:
      - "5432:5432"
    volumes:
      - saas_template_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--server_name", "saas-template"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  saas_template_pg:
