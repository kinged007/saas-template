services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Dev-only throwaway credential, not a secret. Customise via APP_SLUG
      # only when you intend to rotate the throwaway dev DB identity.
      POSTGRES_USER: ${APP_SLUG:-saas_template}
      POSTGRES_PASSWORD: ${APP_SLUG:-saas_template}
      POSTGRES_DB: ${APP_SLUG:-saas_template}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--server_name", "${APP_SLUG:-saas-template}"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pgdata:
    name: "${APP_SLUG:-saas-template}_pg"
