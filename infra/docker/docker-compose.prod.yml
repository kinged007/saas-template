# Production stack: postgres, nats (JetStream), api (FastAPI + migrations), web (nginx).
#
# First-time setup:
#   cp infra/docker/.env.example infra/docker/.env   # then edit the secrets
#
# Deploy / update:
#   docker compose -f infra/docker/docker-compose.prod.yml up --build -d
#
# Only the web service publishes a port (${WEB_PORT:-8080} → 80). It serves the
# SPA and reverse-proxies /api/* to the api service, so the whole app is
# same-origin (no CORS) and postgres/nats stay off the host network.
#
# Migrations run automatically before each api start (`alembic upgrade head`).
# Demo seed data is NOT applied — create the first user via /api/v1/register.
#
# FORWARDED_ALLOW_IPS (optional, see infra/docker/.env.example) lists the peers
# whose X-Forwarded-For uvicorn honours — that header is what lands in audit
# rows, session rows and rate-limit keys. The default is the network pinned
# below: the api service publishes no ports, so nginx is its only peer. Widen it
# only for another proxy in front; docs/OPERATIONS.md has the details.
name: saas-template

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
      POSTGRES_DB: saas_template
    volumes:
      - saas_template_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_template -d saas_template"]
      interval: 5s
      timeout: 5s
      retries: 12

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222", "--server_name", "saas-template"]
    volumes:
      - saas_template_nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://saas_template:${POSTGRES_PASSWORD}@postgres:5432/saas_template
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in infra/docker/.env}
      FERNET_KEYS: ${FERNET_KEYS:?set FERNET_KEYS in infra/docker/.env}
      SECRET_ENCRYPT_VERSION: ${SECRET_ENCRYPT_VERSION:-1}
      EVENT_BUS_DRIVER: nats
      NATS_URL: nats://nats:4222
      # Public origin of the app (used for links in emails etc.). CORS is only
      # relevant for split-origin deployments; same-origin proxying needs none.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn src.main:app --host 0.0.0.0 --port 8000
                  --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-172.30.0.0/24}"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Leave unset for same-origin relative URLs (default, recommended).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  saas_template_pg:
  saas_template_nats:

# Pinned so FORWARDED_ALLOW_IPS can name the api's peer exactly instead of
# guessing whichever /24 Docker hands out next.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
