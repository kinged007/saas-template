{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "saas-template.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: saas-template
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "saas-template.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-template
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-template
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "saas-template"
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: "saas-template"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "saas-template"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "saas-template.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: saas-template
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: saas-template
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      name: postgres
{{- end }}
