{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saas-template.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "saas-template.name" . }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secretKey | quote }}
  FERNET_KEYS: {{ .Values.fernetKeys | quote }}
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
  NATS_URL: {{ .Values.natsUrl | quote }}
  MICROSOFT_CLIENT_ID: {{ .Values.api.oauth.microsoftClientId | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.api.oauth.microsoftClientSecret | quote }}
  MICROSOFT_AUTHORITY: {{ .Values.api.oauth.microsoftAuthority | quote }}
  OKTA_CLIENT_ID: {{ .Values.api.oauth.oktaClientId | quote }}
  OKTA_CLIENT_SECRET: {{ .Values.api.oauth.oktaClientSecret | quote }}
  OKTA_DOMAIN: {{ .Values.api.oauth.oktaDomain | quote }}
{{- end }}
