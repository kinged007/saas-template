apiVersion: v1
kind: Service
metadata:
  name: {{ include "saas-template.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "saas-template.name" . }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "saas-template.name" . }}
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "saas-template.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "saas-template.name" . }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: {{ include "saas-template.name" . }}
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
      name: http
