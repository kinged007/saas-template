# Helm values. Rebrand the release by setting `nameOverride`: it drives the
# fullname, the app.kubernetes.io/name label, the postgres user/db and the
# NATS --server_name. Everything else below is a placeholder to replace.
nameOverride: ""
replicaCount: 2

image:
  repository: my-app
  apiTag: api
  webTag: web
  pullPolicy: IfNotPresent

api:
  port: 8000
  replicas: 2
  # resources:
  #   requests: { cpu: 100m, memory: 256Mi }
  #   limits:   { cpu: 500m, memory: 512Mi }
  oauth:
    microsoftClientId: ""
    microsoftClientSecret: ""
    microsoftAuthority: "https://login.microsoftonline.com/consumers"
    oktaClientId: ""
    oktaClientSecret: ""
    oktaDomain: ""
  readinessProbe:
    path: /api/v1/readyz
  livenessProbe:
    path: /api/v1/healthz

web:
  port: 80

# Existing secrets — set via values or a pre-created secret `<fullname>-secrets`
# with keys: SECRET_KEY, FERNET_KEYS, DATABASE_URL, NATS_URL
existingSecret: ""
secretKey: "change-me"
fernetKeys: "change-me"
databaseUrl: "postgresql+asyncpg://my-app:change-me@postgres:5432/my-app"
natsUrl: "nats://nats:4222"
eventBusDriver: "nats"
corsOrigins: "https://app.example.com"
frontendUrl: "https://app.example.com"

# Deploy postgres + nats as part of the chart (production-grade external
# instances are recommended; set postgres.enabled=false / nats.enabled=false
# and point databaseUrl/natsUrl at them).
postgres:
  enabled: true
  image: postgres:16-alpine
  password: change-me
  persistence:
    size: 8Gi
nats:
  enabled: true
  image: nats:2.10-alpine

ingress:
  enabled: true
  className: nginx
  host: app.example.com
  tls:
    enabled: true
    secretName: app-tls
