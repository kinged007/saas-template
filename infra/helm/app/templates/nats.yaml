{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-nats
  labels:
    app.kubernetes.io/name: {{ include "app.name" . | quote }}
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . | quote }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . | quote }}
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-js", "-m", "8222", "--server_name", {{ .Values.appSlug | quote }}]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          readinessProbe:
            httpGet:
              path: /
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-nats
  labels:
    app.kubernetes.io/name: {{ include "app.name" . | quote }}
    app.kubernetes.io/component: nats
spec:
  selector:
    app.kubernetes.io/name: {{ include "app.name" . | quote }}
    app.kubernetes.io/component: nats
  ports:
    - port: 4222
      name: client
    - port: 8222
      name: monitor
{{- end }}
