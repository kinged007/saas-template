{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "app.name" . | quote }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secretKey | quote }}
  FERNET_KEYS: {{ .Values.fernetKeys | quote }}
  DATABASE_URL: {{ default (printf "postgresql+asyncpg://%s:change-me@%s-postgres:5432/%s" .Values.postgres.user (include "app.fullname" .) .Values.postgres.database) .Values.databaseUrl | quote }}
  NATS_URL: {{ default (printf "nats://%s-nats:4222" (include "app.fullname" .)) .Values.natsUrl | quote }}
  MICROSOFT_CLIENT_ID: {{ .Values.api.oauth.microsoftClientId | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.api.oauth.microsoftClientSecret | quote }}
  MICROSOFT_AUTHORITY: {{ .Values.api.oauth.microsoftAuthority | quote }}
  OKTA_CLIENT_ID: {{ .Values.api.oauth.oktaClientId | quote }}
  OKTA_CLIENT_SECRET: {{ .Values.api.oauth.oktaClientSecret | quote }}
  OKTA_DOMAIN: {{ .Values.api.oauth.oktaDomain | quote }}
{{- end }}
