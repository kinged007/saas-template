name: branch-guard

# docs/FLEET.md (Branch model): detects a direct push or malformed commit on a
# protected branch within minutes. It cannot prevent one; branch rulesets
# would (see docs/FLEET.md, Merge rules).
on:
  push:
    branches: [dev, staging, main]

# Serialize overlapping violating pushes per branch: the open-or-update issue
# step below is list-then-create (not atomic), so two concurrent red runs on
# the same branch could both create a violation issue. Queued (never
# cancelled) so the second run lists after the first run created the issue
# and comments on it instead. Keyed per branch so different branches still
# run independently.
concurrency:
  group: branch-guard-${{ github.ref_name }}
  cancel-in-progress: false

# The guard never pushes or merges, so the default workflow credential is
# enough; issues: write lets a red run open or update the needs-human issue,
# and actions: read lets the resolve step list completed guard runs (#1878).
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  guard:
    if: vars.FLEET_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the last head the guard already checked
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # A burst of 3+ pushes supersedes the middle queued run (the
          # concurrency group keeps one pending run), so its before..after
          # range is never validated. Widen this run back to the newest
          # already-checked head so the gap is still covered (#1878). Only
          # completed success/failure runs count: cancelled (superseded) runs
          # never validated anything. A failure run only counts when its guard
          # step actually reached a verdict: a checkout/runner failure before
          # the guard step validated nothing, so its head must not become the
          # anchor. Any lookup failure falls back to empty, which keeps the
          # pushed range.
          LAST=""
          LIST="$(gh run list --workflow branch-guard.yml --branch "$BRANCH" --status completed --limit 20 --json databaseId,headSha,conclusion 2>/dev/null || true)"
          if [ -n "$LIST" ] && [ "$LIST" != "[]" ]; then
            while read -r ID CONCL SHA; do
              [ -n "$ID" ] || continue
              if [ "$CONCL" = "success" ]; then
                LAST="$SHA"
                break
              fi
              if [ -n "$(gh run view "$ID" --json jobs --jq '.jobs[].steps[]? | select(.name == "Check the pushed range against the branch model" and (.conclusion == "success" or .conclusion == "failure")) | .name' 2>/dev/null || true)" ]; then
                LAST="$SHA"
                break
              fi
            done < <(echo "$LIST" | jq -r --argjson run "$RUN_ID" '.[] | select(.databaseId != $run and (.conclusion == "success" or .conclusion == "failure")) | "\(.databaseId) \(.conclusion) \(.headSha)"' 2>/dev/null || true)
          fi
          echo "sha=$LAST" >> "$GITHUB_OUTPUT"
      - name: Check the pushed range against the branch model
        id: guard
        run: bash scripts/branch-guard.sh "${{ github.ref_name }}" "${{ github.event.before }}" "${{ github.event.after }}" "${{ github.event.forced }}" "${{ steps.last.outputs.sha }}"
      - name: Open or update the needs-human issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          LAST: ${{ steps.last.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -f scripts/branch-guard.sh ]; then
            DIAG="$(bash scripts/branch-guard.sh "$BRANCH" "$BEFORE" "$AFTER" "$FORCED" "$LAST" 2>&1 || true)"
          else
            DIAG="branch-guard.sh not found (the checkout step did not run); see the run log for the guard diagnosis."
          fi
          BODY="$(printf 'Branch `%s` broke the branch model in push `%s..%s` ([run](%s)):\n\n```\n%s\n```\n\nRecover with a new commit (revert the push); never force-push.' "$BRANCH" "$BEFORE" "$AFTER" "$RUN_URL" "$DIAG")"
          TITLE="[branch-guard] $BRANCH violation"
          EXISTING="$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label needs-human --body "$BODY"
          fi
