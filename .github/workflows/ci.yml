name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run ruff check . && uv run ruff format --check .

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run pytest -q --tb=short -p no:cacheprovider

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: cd apps/api && uv sync --extra dev
      - run: make db-check

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run build

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      # "npm test" owns the file set and the reporter; CI only adds the two assertions the run
      # cannot make about itself: node --test exits 0 on an empty discovery, and the src tests
      # are proven present by the invariant tests in src/web-test-tap.test.ts, which fail if a
      # tracked test file falls outside the "test" glob.
      - name: run web tests
        run: |
          set -eo pipefail
          cd apps/web
          npm test | tee web-test.tap
          grep -qE '^# tests [1-9]' web-test.tap

  trailing-newline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check trailing newlines
        run: |
          set -eo pipefail
          failed=0
          while IFS= read -r -d '' f; do
            case "$f" in
              .codesight/*|review-artifacts/*) continue ;;
            esac
            [ -s "$f" ] || continue
            if [ -n "$(tail -c1 "$f")" ]; then
              echo "no trailing newline: $f"
              failed=1
            fi
          done < <(git ls-files -z '*.ts' '*.tsx' '*.py' '*.sh' '*.md')
          exit $failed
