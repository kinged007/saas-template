name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run ruff check . && uv run ruff format --check .

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run pytest -q --tb=short -p no:cacheprovider

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: make db-check

  # One matrix over the three frontend checks, so the checkout, setup-node and
  # npm ci block exists once instead of three times. The name keeps the
  # previous check names (web-build, web-test, web-e2e) for branch protection.
  # fail-fast off: a red leg must not cancel the others.
  web:
    name: web-${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [build, test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - if: matrix.command == 'build'
        run: cd apps/web && npm run build
      # Default discovery matches the "test" script's glob; the pattern lives only in package.json.
      # node --test exits 0 when it discovers nothing, so assert a non-zero count.
      - if: matrix.command == 'test'
        name: run web tests
        run: |
          set -eo pipefail
          cd apps/web
          node --test --test-reporter=tap | tee web-test.tap
          grep -qE '^# tests [1-9]' web-test.tap
      - if: matrix.command == 'e2e'
        run: cd apps/web && npx playwright install --with-deps chromium
      - if: matrix.command == 'e2e'
        run: cd apps/web && npm run test:e2e
      # A red run has to be diagnosable from here: the HTML report carries the
      # per-spec error, the retained trace and the screenshot of each failure.
      - if: failure() && matrix.command == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          # A red e2e leg always writes both directories; finding neither means
          # the run failed before Playwright did, which the default `warn` hides.
          if-no-files-found: error
