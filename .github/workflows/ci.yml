name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run ruff check . && uv run ruff format --check .

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run pytest -q --tb=short -p no:cacheprovider

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: make db-check

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (dev)
        run: docker compose -f infra/docker/docker-compose.dev.yml config -q
      - name: docker compose config (prod)
        env:
          SECRET_KEY: ci-placeholder
          FERNET_KEYS: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
        run: docker compose -f infra/docker/docker-compose.prod.yml config -q
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/saas-template
      - run: helm template test infra/helm/saas-template --set nameOverride=acme > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform/aws init -backend=false
      - run: terraform -chdir=infra/terraform/aws validate

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run build
