name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run ruff check . && uv run ruff format --check .

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run pytest -q --tb=short -p no:cacheprovider

  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --extra dev
      - run: make db-check

  # The conf is only parsed by a container at deploy time, so run nginx -t on the image
  # Dockerfile.web builds, with the conf at the path that Dockerfile copies it to.
  nginx-conf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # api is the proxy_pass upstream; nginx resolves it while parsing the conf, so
      # give it a loopback address or nginx -t fails on a valid conf.
      - run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "${{ github.workspace }}/infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run build

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      # Default discovery matches the "test" script's glob; the pattern lives only in package.json.
      # node --test exits 0 when it discovers nothing, so assert a non-zero count.
      - name: run web tests
        run: |
          set -eo pipefail
          cd apps/web
          node --test --test-reporter=tap | tee web-test.tap
          grep -qE '^# tests [1-9]' web-test.tap

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: cd apps/web && npm run test:e2e
